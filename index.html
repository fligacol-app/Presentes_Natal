function specific(p,a){const tests=[];if(a.scent&&a.scent!=='any'&&p.categories.includes('perfume'))tests.push(p.tags.includes(a.scent)?1:0);if(a.face&&a.face!=='any'&&p.categories.includes('face'))tests.push(p.tags.includes(a.face)?1:0);if(a.makeup&&a.makeup!=='any'&&p.categories.includes('makeup'))tests.push(p.tags.includes(a.makeup)?1:0);return tests.length?Math.max(...tests):null}
function rank(a=state.answers){const child=a.recipient==='child',interests=a.interests||['any'];return catalog.filter(p=>{if(p.excluded||p.active===false||!Number.isFinite(p.stock)||p.stock<=0||!safeURL(p.url))return false;if(child){if(!a.age||!p.toy||p.minAge===null||a.age.months<p.minAge||p.maxAge!==null&&a.age.months>p.maxAge)return false;if(p.minAge===0&&a.age.months>12)return false;if(/dentição|denticao/i.test(p.name)&&a.age.months>18)return false;if(a.childIntent==='comfort'&&!/dou\s?dou|doudou|mobile|móbile/i.test(p.name))return false}else{if(p.baby)return false;if(!interests.includes('any')&&!interests.some(i=>p.categories.includes(i)))return false;if(a.knowledge==='no'&&p.tags.includes('firm'))return false;const branches=interests.filter(i=>i!=='any');if(branches.length){const fit=branches.some(i=>{if(!p.categories.includes(i))return false;const key={perfume:'scent',face:'face',makeup:'makeup'}[i],v=a[key];return !key||!v||v==='any'||p.tags.includes(v)});if(!fit)return false}}
if(a.value&&a.value!=='any'&&!a._soft){const b=config.bands[a.value];if(!b||p.price<b.min||p.price>b.max)return false}return true}).map(p=>{let total=0,weights=0;function add(k,v){if(v!==null){total+=config.weights[k]*v;weights+=config.weights[k]}}add('interest',child?1:interests.includes('any')?null:1);add('specific',specific(p,a));const band=config.bands[a.value];add('value',band?Math.exp(-Math.abs(p.price-band.target)/Math.max(15,band.target*.5)):null);const relevance=weights?total/weights:0;const salesSignal=Math.min(1,Math.log1p(Math.max(0,Number(p.sales)||0))/Math.log(51));const giftSignal=Math.min(1,Math.max(0,Number(p.giftAppeal)||0));const marketSignal=Math.min(1,Math.max(0,Number(p.marketEditorial?.score)||0));return {product:p,score:.85*relevance+.07*salesSignal+.06*giftSignal+.02*marketSignal}}).sort((x,y)=>y.score-x.score||y.product.sales-x.product.sales||x.product.id.localeCompare(y.product.id))}
function groupKey(p){return p.name.toLowerCase().replace(/\b(?:natal|xmas)\s*\d*|202\d/g,'').replace(/\d+(?:[,.]\d+)?\s*(?:ml|gr|g)\b/g,'').replace(/\s+/g,' ').trim()}
function dedupe(list){const seen=new Set(),out=[];for(const {product:p}of list){const k=groupKey(p);if(!seen.has(k)){seen.add(k);out.push(p)}}return out}
function childBundle(){const a={...state.answers,value:'any'};const pool=dedupe(rank(a)).sort((x,y)=>y.price-x.price);const picked=[];let sum=0;for(const p of pool){if(picked.length>=4)break;picked.push(p);sum+=p.price;if(sum>config.bundleMin&&picked.length>=2)break}return sum>config.bundleMin&&picked.length>=2?picked:null}
function selection(){const a=state.answers;let l=dedupe(rank(a));if(l.length)return {list:l,note:''};const b={...a};let changed=false;for(const k of ['scent','face','makeup'])if(b[k]&&b[k]!=='any'){b[k]='any';changed=true}if(changed){l=dedupe(rank(b));if(l.length)return {list:l,note:'Não encontrámos uma correspondência exata para o estilo indicado, por isso apresentamos outras opções da mesma categoria e do estilo de presente escolhido.'}}if(a.value&&a.value!=='any'){l=dedupe(rank({...b,_soft:true}));if(l.length)return {list:l,note:'De momento não há artigos desta seleção para as preferências indicadas. Apresentamos as opções mais próximas; consulte as condições em cada página.'}}if(a.recipient==='child'&&a.childIntent&&a.childIntent!=='any'){l=dedupe(rank({...a,childIntent:'any',_soft:a.value==='high'?true:a._soft}));if(l.length)return {list:l,note:'Não há artigos de aconchego com indicação etária confirmada para esta idade. Apresentamos brinquedos adequados à idade indicada.'}}return {list:[],note:''}}
function explain(p){const a=state.answers;if(a.recipient==='child')return 'Uma sugestão com indicação etária compatível com a idade que indicou. Confirme as informações de utilização na página do produto.';const phrases={fresh:'fragrâncias frescas e cítricas',floral:'fragrâncias florais',sweet:'fragrâncias doces e envolventes',wood:'fragrâncias amadeiradas',hydrate:'hidratação e conforto',glow:'luminosidade',firm:'firmeza e cuidado antienvelhecimento',simple:'uma rotina simples',lips:'um toque de cor nos lábios',eyes:'maquilhagem de olhos',tools:'pincéis e acessórios',set:'um conjunto para oferecer'};for(const key of ['scent','face','makeup'])if(phrases[a[key]]&&p.tags.includes(a[key]))return 'Selecionado pela sua preferência por '+phrases[a[key]]+'.';const cat=(a.interests||[]).find(i=>p.categories.includes(i))||p.categories[0];const labels={perfume:'perfumaria',face:'cuidados de rosto',body:'cuidados de corpo, mãos e lábios',makeup:'maquilhagem',hair:'cuidados de cabelo',travel:'essenciais de viagem'};return 'Uma sugestão de '+(labels[cat]||'cuidado')+' para explorar, de acordo com os interesses indicados.'}
function productImage(p){if(typeof p.imageUrl!=='string'||!/^https:\/\//i.test(p.imageUrl))return gift('placeholder',false);const link=productLink(p,'','placeholder','Ver produto: '+p.name);const img=document.createElement('img');img.src=p.imageUrl;img.alt=p.name;img.loading='lazy';img.decoding='async';img.style.cssText='width:100%;height:100%;object-fit:contain';img.addEventListener('error',()=>link.replaceWith(gift('placeholder',false)),{once:true});link.append(img);return link}
function productCard(p,index){const card=e('article','product'+(index===0?' featured':''));card.style.setProperty('--i',String(index%6));card.append(e('div','badge',index===0?'Sugestão principal':'Outra ideia para oferecer'),productImage(p),e('div','brand',p.brand));const title=e('h3');title.append(productLink(p,p.name,''));card.append(title,e('p','',explain(p)),productLink(p,'Ver produto  ↗','cta','Ver produto: '+p.name));return card}
function results(){state.screen='results';const child=state.answers.recipient==='child';let bundle=null,list=[],note='';if(child&&state.answers.value==='high'){bundle=childBundle()}else{const s=selection();list=s.list;note=s.note}if(child&&state.answers.value==='high'&&!bundle){const s=selection();list=s.list;note=s.note}const has=!!bundle||list.length>0,main=box(100);if(has)main.append(snow(10));main.append(e('div','eyebrow','A sua seleção'),e('h2','',has?(bundle?'Uma combinação para oferecer.':state.answers.recipient==='self'?'Uma seleção a pensar em si.':'Presentes escolhidos a pensar nessa pessoa.'):'Vamos ajustar a seleção?'));const summary=e('div','summary');summary.append(e('p','',has?'Cruzámos as preferências que indicou com os produtos do catálogo. Estas sugestões são um ponto de partida para escolher com cuidado.':'Não encontrámos sugestões suficientemente próximas das preferências indicadas. Pode rever as respostas ou ver opções sem preferência de presente.'));const chips=e('div','chips');for(const key of ['interests','scent','face','makeup','value']){const val=state.answers[key];for(const v of Array.isArray(val)?val:[val]){const op=definitions[key].options?.find(x=>x[0]===v);if(op&&v!=='any')chips.append(e('span','chip',op[1]))}}if(child)chips.append(e('span','chip','Idade: '+state.answers.age.months+' meses'));summary.append(chips);main.append(summary);if(note)main.append(e('p','notice',note));if(child)main.append(e('p','notice','Os cuidados infantis e os brinquedos sem indicação etária confirmada aguardam validação da farmácia e não são sugeridos automaticamente. A idade nunca é alargada para preencher resultados.'));
if(bundle){const b=e('article','bundle');b.append(e('div','eyebrow','Combinação com sentido'),e('h3','','Brincar, descobrir e aconchegar'),e('p','','Em vez de um único artigo, reunimos presentes complementares, todos com indicação etária compatível. Pode escolher todos ou apenas alguns.'));const items=e('div','items');bundle.forEach(p=>{const it=e('article','item');it.append(productImage(p),e('div','brand',p.brand));const h=e('h4');h.append(productLink(p,p.name,''));it.append(h,e('p','','Indicação etária confirmada no catálogo.'),productLink(p,'Ver produto  ↗','cta','Ver produto: '+p.name));items.append(it)});b.append(items,e('p','micro','Os artigos são vendidos separadamente. As condições em vigor podem ser consultadas na página de cada produto.'));main.append(b)}
else if(list.length){const grid=e('div','products');list.slice(0,state.shown).forEach((p,i)=>grid.append(productCard(p,i)));main.append(grid,e('p','micro','As condições em vigor podem ser consultadas na página de cada produto. A disponibilidade é confirmada na respetiva página.'))}
const actions=e('nav','actions results-actions');actions.setAttribute('aria-label','Ajustar resultados');actions.append(btn('← Ajustar preferências',()=>{state.index=path().length-1;question()},'text-button'));const right=e('div','actions-right');if(state.answers.value!=='any')right.append(btn('Ver sem preferência de presente',()=>{state.answers.value='any';state.shown=6;results()},'cta secondary'));if(list.length>state.shown)right.append(btn('Ver outras sugestões',()=>{state.shown+=6;results()},'cta secondary'));right.append(btn('Começar de novo',()=>{state={screen:'intro',index:0,answers:{},shown:6,still:state.still};intro()},'cta secondary'));actions.append(right);main.append(actions);focusTitle(main)}

}).catch(err=>{console.error('Catálogo do quiz:',err);if(mount){const p=document.createElement('p');p.textContent='Não foi possível carregar as sugestões. Atualize a página ou tente novamente mais tarde.';const target=mount.shadowRoot||mount;target.replaceChildren(p)}})})();</script></body></html>
