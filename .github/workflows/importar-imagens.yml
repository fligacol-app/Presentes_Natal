name: Importar fotografias dos produtos
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: importar-imagens
  cancel-in-progress: false
jobs:
  imagens:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: python -m pip install requests beautifulsoup4
      - name: Importar imagens
        run: python importar_imagens.py
      - name: Disponibilizar ficheiros para revisão
        uses: actions/upload-artifact@v4
        with:
          name: catalogo-com-imagens
          path: |
            catalogo.json
            relatorio-imagens.json
